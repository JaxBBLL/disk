services:
  disk:
    build:
      context: .
      dockerfile: Dockerfile
    image: showzea/disk:latest
    container_name: disk
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。容器端口由 config.json 的 port 决定，改端口时两处要同步改
      - "9527:9527"
    environment:
      TZ: Asia/Shanghai
      # 也可在此覆盖监听地址（默认取 config.json 的 bind，未配置则 0.0.0.0）
      # HOST: 0.0.0.0
    volumes:
      # 文件根目录：对应 config.json 的 dest（./disk → /app/disk）
      - disk-data:/app/disk
      # 运行配置（只读挂载，改完后 docker compose restart disk 生效）
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9527/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  disk-data:

# 若想把文件直接放在宿主机目录（便于挂载到 NAS / 备份），把上面的
# disk-data:/app/disk 换成下面这行，并保证目录属主为容器内的 node 用户：
#   - ./data:/app/disk
#   chown -R 1000:1000 ./data
